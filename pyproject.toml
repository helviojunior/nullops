[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filemanager-web"
dynamic = ["version"]
description = "Stand-alone encrypted web file manager built on the Python stdlib http.server"
readme = "README.md"
requires-python = ">=3.8,<4"
license = { text = "GPL-3.0" }
authors = [
    { name = "Helvio Junior (M4v3r1ck)", email = "helvio.junior@sec4us.com.br" },
]
keywords = ["file-manager", "http.server", "web", "filemanager", "tinyfilemanager", "stand-alone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=3.4",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/helviojunior/filemanager"
Source = "https://github.com/helviojunior/filemanager"
Author = "https://github.com/helviojunior"

[project.scripts]
filemanager-web = "filemanager_web.filemanager:run"

[tool.setuptools]
packages = [
    "filemanager_web",
    "filemanager_web.server",
    "filemanager_web.libs",
    "filemanager_web.util",
]
include-package-data = true

[tool.setuptools.package-data]
filemanager_web = [
    "web/*.html",
    "web/css/*.css",
    "web/js/*.js",
]

[tool.setuptools.dynamic]
version = { attr = "filemanager_web.__meta__.__version__" }
