<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 260" width="100%" height="100%">
  <!-- Ícone do Terminal -->
  <g id="terminal-icon">
    <!-- Borda externa arredondada -->
    <rect x="20" y="20" width="212" height="212" rx="44" ry="44" fill="none" stroke="#FFFFFF" stroke-width="18" />
    <!-- Símbolo '>' em vermelho -->
    <path d="M 65 73 L 130 105 C 135 108 135 116 130 119 L 65 151 L 65 129 L 103 112 L 65 95 Z" fill="#A81818" />
    <!-- Cursor '_' em branco -->
    <rect x="128" y="156" width="66" height="19" rx="2" fill="#FFFFFF" />
  </g>

  <!-- Texto "Null" (Branco) -->
